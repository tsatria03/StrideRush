[movement]

jump=UP,W
duck=DOWN,S
duck_held=DOWN:down,S:down
duck_release=DOWN:release,S:release
lane_left=LEFT,Q
lane_right=RIGHT,E

[interaction]

hand_left=TAB,A
hand_right=RETURN,D

[combat]

fire=SPACE
fire_held=SPACE:down
ammo_check=X
reload=R
weapon_1=1
weapon_2=2
weapon_3=3
weapon_4=4
weapon_5=5
weapon_6=6
weapon_7=7
weapon_8=8
weapon_9=9
weapon_10=0

[inventory]

inventory_previous=I:repeat
inventory_next=O:repeat
item_use=U:repeat

[info]

info_lives=H
info_distance=Z
info_speed=C
info_time=T
info_shield=M
info_lane=L

[volume]

ambience_up=HOME:repeat,F6:repeat
ambience_down=END:repeat,F5:repeat
music_up=PAGEUP:repeat,F4:repeat
music_down=PAGEDOWN:repeat,F3:repeat

[screens]

pause=P
quit_run=ESCAPE:repeat
view_bindings=F1
settings=F2

[buffer]

buffer_item_previous=COMMA:repeat
buffer_item_next=PERIOD:repeat
buffer_item_first=SHIFT+COMMA:repeat
buffer_item_last=SHIFT+PERIOD:repeat
buffer_previous=LEFTBRACKET:repeat
buffer_next=RIGHTBRACKET:repeat
buffer_first=SHIFT+LEFTBRACKET:repeat
buffer_last=SHIFT+RIGHTBRACKET:repeat
buffer_mute=SHIFT+M:repeat
buffer_copy_item=SHIFT+C
buffer_review_item=ALT+SHIFT+C
buffer_menu=SHIFT+B
buffer_export=SHIFT+BACKSLASH
